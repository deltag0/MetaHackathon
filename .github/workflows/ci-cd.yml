name: CI/CD

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hackathon_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        env:
          DATABASE_NAME: hackathon_db
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
          FLASK_DEBUG: "false"
        run: uv run pytest -v --cov=app --cov-branch --cov-report=term-missing --cov-report=html --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to droplet 1 and run migrations
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST_1 }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd ~/MetaHackathon
            git pull origin main

            cat > .env << 'EOF'
            DO_HOST_1=${{ secrets.DO_HOST_1 }}
            DO_HOST_2=${{ secrets.DO_HOST_2 }}
            DO_OBSERVABILITY=${{ secrets.DO_OBSERVABILITY }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_SSLMODE=require
            REDIS_URL=${{ secrets.REDIS_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            SMTP_SMARTHOST=${{ secrets.SMTP_SMARTHOST }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            SMTP_AUTH_USERNAME=${{ secrets.SMTP_AUTH_USERNAME }}
            SMTP_AUTH_PASSWORD=${{ secrets.SMTP_AUTH_PASSWORD }}
            ALERT_EMAIL_TO=${{ secrets.ALERT_EMAIL_TO }}
            DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
            S3_KEY=${{ secrets.S3_KEY }}
            SECRET_S3_KEY=${{ secrets.SECRET_S3_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            LOKI_S3_BUCKET=${{ secrets.LOKI_S3_BUCKET }}
            EOF

            docker build -t url-shortner-app .
            docker build -t url-shortner-frontend -f frontend/docker/Dockerfile frontend

            docker run --rm \
              -e DATABASE_NAME=${{ secrets.DATABASE_NAME }} \
              -e DATABASE_HOST=${{ secrets.DATABASE_HOST }} \
              -e DATABASE_PORT=${{ secrets.DATABASE_PORT }} \
              -e DATABASE_USER=${{ secrets.DATABASE_USER }} \
              -e DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }} \
              -e DATABASE_SSLMODE=require \
              url-shortner-app \
              /app/.venv/bin/python -m scripts.run_migrations

            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml restart nginx

      - name: Deploy to droplet 2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST_2 }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd ~/MetaHackathon
            git pull origin main

            cat > .env << 'EOF'
            DO_HOST_1=${{ secrets.DO_HOST_1 }}
            DO_HOST_2=${{ secrets.DO_HOST_2 }}
            DO_OBSERVABILITY=${{ secrets.DO_OBSERVABILITY }}
            DATABASE_NAME=${{ secrets.DATABASE_NAME }}
            DATABASE_HOST=${{ secrets.DATABASE_HOST }}
            DATABASE_PORT=${{ secrets.DATABASE_PORT }}
            DATABASE_USER=${{ secrets.DATABASE_USER }}
            DATABASE_PASSWORD=${{ secrets.DATABASE_PASSWORD }}
            DATABASE_SSLMODE=require
            REDIS_URL=${{ secrets.REDIS_URL }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            SMTP_SMARTHOST=${{ secrets.SMTP_SMARTHOST }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            SMTP_AUTH_USERNAME=${{ secrets.SMTP_AUTH_USERNAME }}
            SMTP_AUTH_PASSWORD=${{ secrets.SMTP_AUTH_PASSWORD }}
            ALERT_EMAIL_TO=${{ secrets.ALERT_EMAIL_TO }}
            DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
            S3_KEY=${{ secrets.S3_KEY }}
            SECRET_S3_KEY=${{ secrets.SECRET_S3_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            LOKI_S3_BUCKET=${{ secrets.LOKI_S3_BUCKET }}
            EOF

            docker build -t url-shortner-app .
            docker build -t url-shortner-frontend -f frontend/docker/Dockerfile frontend

            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker compose -f docker-compose.prod.yml restart nginx

      - name: Deploy observability stack to observability droplet
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_OBSERVABILITY }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd ~/MetaHackathon
            git pull origin main

            cat > .env << 'EOF'
            DO_HOST_1=${{ secrets.DO_HOST_1 }}
            DO_HOST_2=${{ secrets.DO_HOST_2 }}
            DO_OBSERVABILITY=${{ secrets.DO_OBSERVABILITY }}
            SMTP_SMARTHOST=${{ secrets.SMTP_SMARTHOST }}
            SMTP_FROM=${{ secrets.SMTP_FROM }}
            SMTP_AUTH_USERNAME=${{ secrets.SMTP_AUTH_USERNAME }}
            SMTP_AUTH_PASSWORD=${{ secrets.SMTP_AUTH_PASSWORD }}
            ALERT_EMAIL_TO=${{ secrets.ALERT_EMAIL_TO }}
            ALERT_SMS_TO=${{ secrets.ALERT_SMS_TO }}
            DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
            S3_KEY=${{ secrets.S3_KEY }}
            SECRET_S3_KEY=${{ secrets.SECRET_S3_KEY }}
            AWS_REGION=${{ secrets.AWS_REGION }}
            LOKI_S3_BUCKET=${{ secrets.LOKI_S3_BUCKET }}
            EOF

            docker compose -f docker-compose.observability.prod.yml up -d --remove-orphans
