name: CI/CD

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check .

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: hackathon_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        env:
          DATABASE_NAME: hackathon_db
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
          DATABASE_USER: postgres
          DATABASE_PASSWORD: postgres
          REDIS_URL: redis://localhost:6379/0
          FLASK_DEBUG: "false"
        run: uv run pytest -v --cov=app --cov-branch --cov-report=term-missing --cov-report=html --cov-fail-under=70

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to DigitalOcean
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DO_HOST }}
          username: root
          key: ${{ secrets.DO_SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            cd ~/MetaHackathon
            git pull origin main

            # Build images
            docker compose build app-1 frontend
            docker tag url-shortner-app-1 url-shortner-app

            # Init swarm if not already active ("inactive" contains "active" so use exact match)
            # Use DigitalOcean metadata API to get the droplet's public IP
            if ! docker info --format '{{.Swarm.LocalNodeState}}' | grep -qx active; then
              PUBLIC_IP=$(curl -s --max-time 5 http://169.254.169.254/metadata/v1/interfaces/public/0/ipv4/address)
              docker swarm init --advertise-addr "$PUBLIC_IP"
            fi

            # Deploy the stack (creates or updates in-place)
            if ! docker stack deploy -c docker-compose.swarm.yml url-shortner; then
              echo "Deployment failed!"
              docker stack ps url-shortner --no-trunc
              exit 1
            fi

            # Wait for Swarm to create the overlay network and db to be reachable
            sleep 20

            # Run DB migrations on the Swarm overlay network (avoids conflicting with Swarm's db)
            docker run --rm \
              --network url-shortner_default \
              -e DATABASE_NAME=hackathon_db \
              -e DATABASE_HOST=db \
              -e DATABASE_PORT=5432 \
              -e DATABASE_USER=postgres \
              -e DATABASE_PASSWORD=postgres \
              url-shortner-app \
              /app/.venv/bin/python -m scripts.run_migrations
