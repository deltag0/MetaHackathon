services:
  # ── App infrastructure ──────────────────────────────────────────────
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: hackathon_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command:
      - "postgres"
      - "-c"
      - "max_connections=200"
      - "-c"
      - "shared_buffers=256MB"
      - "-c"
      - "work_mem=4MB"
      - "-c"
      - "effective_cache_size=512MB"
      - "-c"
      - "synchronous_commit=off"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G
      restart_policy:
        condition: any
        delay: 5s

  redis:
    image: redis:7
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M
      restart_policy:
        condition: any
        delay: 5s

  # ── App instances (4 instances + nginx LB) ──────────────────────────
  app-1:
    image: url-shortner-app
    environment:
      DATABASE_NAME: hackathon_db
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
      SECRET_KEY: random_secret_key
      LOG_FILE_PATH: /app/logs/app.log
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    volumes:
      - app1_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 30s

  app-2:
    image: url-shortner-app
    environment:
      DATABASE_NAME: hackathon_db
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
      SECRET_KEY: random_secret_key
      LOG_FILE_PATH: /app/logs/app.log
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    volumes:
      - app2_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 30s

  app-3:
    image: url-shortner-app
    environment:
      DATABASE_NAME: hackathon_db
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
      SECRET_KEY: random_secret_key
      LOG_FILE_PATH: /app/logs/app.log
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    volumes:
      - app3_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 30s

  app-4:
    image: url-shortner-app
    environment:
      DATABASE_NAME: hackathon_db
      DATABASE_HOST: db
      DATABASE_PORT: "5432"
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      REDIS_URL: redis://redis:6379
      SECRET_KEY: random_secret_key
      LOG_FILE_PATH: /app/logs/app.log
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    volumes:
      - app4_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    deploy:
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 0
        window: 30s

  nginx:
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ${PWD}/nginx/nginx.gold.conf:/etc/nginx/conf.d/default.conf:ro
    deploy:
      restart_policy:
        condition: any
        delay: 5s

  frontend:
    image: url-shortner-frontend
    ports:
      - "3000:3000"
    deploy:
      restart_policy:
        condition: any
        delay: 5s

  # ── Observability stack ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ${PWD}/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ${PWD}/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
    deploy:
      restart_policy:
        condition: any

  alertmanager:
    image: prom/alertmanager:latest
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sed -e "s|SMTP_SMARTHOST_VALUE|$$SMTP_SMARTHOST|g" \
            -e "s|SMTP_FROM_VALUE|$$SMTP_FROM|g" \
            -e "s|SMTP_AUTH_USERNAME_VALUE|$$SMTP_AUTH_USERNAME|g" \
            -e "s|SMTP_AUTH_PASSWORD_VALUE|$$SMTP_AUTH_PASSWORD|g" \
            -e "s|ALERT_EMAIL_TO_VALUE|$$ALERT_EMAIL_TO|g" \
            -e "s|ALERT_SMS_TO_VALUE|$$ALERT_SMS_TO|g" \
            -e "s|DISCORD_WEBHOOK_URL_VALUE|$$DISCORD_WEBHOOK_URL|g" \
            /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml \
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    environment:
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-localhost:25}
      SMTP_FROM: ${SMTP_FROM:-alerts@example.com}
      SMTP_AUTH_USERNAME: ${SMTP_AUTH_USERNAME:-}
      SMTP_AUTH_PASSWORD: ${SMTP_AUTH_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@example.com}
      ALERT_SMS_TO: ${ALERT_SMS_TO:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ${PWD}/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
    ports:
      - "9093:9093"
    deploy:
      restart_policy:
        condition: any

  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    environment:
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_URL:-}
    deploy:
      restart_policy:
        condition: any

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    volumes:
      - ${PWD}/prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"
    deploy:
      restart_policy:
        condition: any

  node-exporter:
    image: prom/node-exporter:latest
    command:
      - --no-collector.kernel_hung
    ports:
      - "9100:9100"
    deploy:
      restart_policy:
        condition: any

  otel:
    image: otel/opentelemetry-collector-contrib:latest
    volumes:
      - ${PWD}/otel/config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "8889:8889"
      - "4318:4318"
    deploy:
      restart_policy:
        condition: any

  loki:
    image: grafana/loki:3.0.0
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ${PWD}/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    deploy:
      restart_policy:
        condition: any

  promtail:
    image: grafana/promtail:3.0.0
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ${PWD}/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-data:/tmp
    deploy:
      restart_policy:
        condition: any

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ${PWD}/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ${PWD}/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ${PWD}/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ${PWD}/grafana/dashboards:/var/lib/grafana/dashboards:ro
    deploy:
      restart_policy:
        condition: any

volumes:
  grafana-data:
  postgres_data:
  loki-data:
  promtail-data:
  app1_logs:
  app2_logs:
  app3_logs:
  app4_logs:
