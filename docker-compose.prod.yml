      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ${PWD}/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: url-shortner-frontend
    restart: always
    ports:
      - "3000:3000"

  promtail:
    image: grafana/promtail:3.0.0
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ${PWD}/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-data:/tmp

volumes:
  promtail-data:
  app1_logs:
  app2_logs:
  app3_logs:
  app4_logs:
