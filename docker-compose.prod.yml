services:
  app-1:
    image: url-shortner-app
    restart: always
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-require}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      LOG_FILE_PATH: /app/logs/app-1.log
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    volumes:
      - app1_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  app-2:
    image: url-shortner-app
    restart: always
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_HOST: ${DATABASE_HOST}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      DATABASE_SSLMODE: ${DATABASE_SSLMODE:-require}
      REDIS_URL: ${REDIS_URL}
      SECRET_KEY: ${SECRET_KEY}
      LOG_FILE_PATH: /app/logs/app-2.log
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel:4318
    volumes:
      - app2_logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health/live')"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5

  nginx:
    image: nginx:latest
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  frontend:
    image: url-shortner-frontend
    restart: always
    ports:
      - "3000:3000"

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro

  alertmanager:
    image: prom/alertmanager:latest
    restart: always
    entrypoint: /bin/sh
    command:
      - -c
      - |
        sed -e "s|SMTP_SMARTHOST_VALUE|$$SMTP_SMARTHOST|g" \
            -e "s|SMTP_FROM_VALUE|$$SMTP_FROM|g" \
            -e "s|SMTP_AUTH_USERNAME_VALUE|$$SMTP_AUTH_USERNAME|g" \
            -e "s|SMTP_AUTH_PASSWORD_VALUE|$$SMTP_AUTH_PASSWORD|g" \
            -e "s|ALERT_EMAIL_TO_VALUE|$$ALERT_EMAIL_TO|g" \
            -e "s|SMTP_AUTH_PASSWORD_VALUE|$$SMTP_AUTH_PASSWORD|g" \
            -e "s|ALERT_SMS_TO_VALUE|$$ALERT_SMS_TO|g" \
            -e "s|DISCORD_WEBHOOK_URL_VALUE|$$DISCORD_WEBHOOK_URL|g" \
            /etc/alertmanager/alertmanager.tmpl.yml > /tmp/alertmanager.yml \
        && exec /bin/alertmanager --config.file=/tmp/alertmanager.yml
    environment:
      SMTP_SMARTHOST: ${SMTP_SMARTHOST:-localhost:25}
      SMTP_FROM: ${SMTP_FROM:-alerts@example.com}
      SMTP_AUTH_USERNAME: ${SMTP_AUTH_USERNAME:-}
      SMTP_AUTH_PASSWORD: ${SMTP_AUTH_PASSWORD:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-admin@example.com}
      ALERT_SMS_TO: ${ALERT_SMS_TO:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.tmpl.yml:ro
    ports:
      - "9093:9093"

  alertmanager-discord:
    image: benjojo/alertmanager-discord:latest
    restart: always
    environment:
      DISCORD_WEBHOOK: ${DISCORD_WEBHOOK_URL:-}

  blackbox-exporter:
    image: prom/blackbox-exporter:latest
    restart: always
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    ports:
      - "9115:9115"

  node-exporter:
    image: prom/node-exporter:latest
    restart: always
    command:
      - --no-collector.kernel_hung
    ports:
      - "9100:9100"

  otel:
    image: otel/opentelemetry-collector-contrib:latest
    restart: always
    volumes:
      - ./otel/config.yaml:/etc/otelcol-contrib/config.yaml
    ports:
      - "8889:8889"
      - "4318:4318"

  loki:
    image: grafana/loki:3.0.0
    restart: always
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  promtail:
    image: grafana/promtail:3.0.0
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - promtail-data:/tmp

  grafana:
    image: grafana/grafana:latest
    restart: always
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  grafana-data:
  loki-data:
  promtail-data:
  app1_logs:
  app2_logs:
