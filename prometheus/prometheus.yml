global:
  scrape_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['${DO_OBSERVABILITY}:9093']

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['${DO_OBSERVABILITY}:9090'] # Prometheus server on observability droplet

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['${DO_OBSERVABILITY}:8889'] # OTel Collector on observability droplet
    metrics_path: /metrics

  - job_name: 'node-exporter-droplet-1'
    static_configs:
      - targets: ['${DO_HOST_1}:9100']
    metrics_path: /metrics

  - job_name: 'node-exporter-droplet-2'
    static_configs:
      - targets: ['${DO_HOST_2}:9100']
    metrics_path: /metrics

  - job_name: 'process-exporter-droplet-1'
    static_configs:
      - targets: ['${DO_HOST_1}:9256']
    metrics_path: /metrics

  - job_name: 'process-exporter-droplet-2'
    static_configs:
      - targets: ['${DO_HOST_2}:9256']
    metrics_path: /metrics

  - job_name: 'blackbox-health'
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://${DO_HOST_1}:80/health/live
          - http://${DO_HOST_1}:80/health/ready
        labels:
          service: app-droplet-1
      - targets:
          - http://${DO_HOST_2}:80/health/live
          - http://${DO_HOST_2}:80/health/ready
        labels:
          service: app-droplet-2
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: ${DO_OBSERVABILITY}:9115
    scrape_interval: 15s

  - job_name: 'blackbox-exporter'
    static_configs:
      - targets: ['${DO_OBSERVABILITY}:9115']
    metrics_path: /metrics

  - job_name: 'loki'
    static_configs:
      - targets: ['${DO_OBSERVABILITY}:3100']
    metrics_path: /metrics

  - job_name: 'promtail'
    static_configs:
      - targets: ['${DO_OBSERVABILITY}:9080']
    metrics_path: /metrics
